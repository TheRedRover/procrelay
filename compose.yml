services:
  procrelay:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: procrelay
    # Share the host PID namespace so /proc reflects host processes.
    pid: host
    ports:
      - "8080:8080"
    environment:
      PROCRELAY_PORT: "8080"
      PROCRELAY_LOG_LEVEL: "info"
    # Read-only, no extra privileges: the agent only ever reads /proc.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
